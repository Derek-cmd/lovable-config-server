server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/lovable-intelligence-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  ai:
    model.chat: openai
    openai:
      base-url: https://openrouter.ai/api/v1
      chat:
        model: google/gemini-3-flash-preview
        temperature: 0.2
